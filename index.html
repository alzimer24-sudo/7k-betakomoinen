<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7K Beta V2</title><style>
body{font:16px system-ui;margin:0;background:#f5f5f5;color:#222}header{background:#bb1025;color:white;padding:22px}h1{margin:0}main{max-width:850px;margin:auto;padding:16px}section{background:white;border-radius:12px;padding:16px;margin:12px 0}button,input,select{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px}button{cursor:pointer}button.active,.primary{background:#bb1025;color:white;border:0}input{max-width:95%}.entry{padding:12px;border-bottom:1px solid #ddd}.muted{color:#666;font-size:14px}.credit{font-size:36px;font-weight:800;color:#bb1025}.flex{display:flex;gap:6px;flex-wrap:wrap;align-items:center}label{display:block;margin:8px 0}</style></head><body><header><h1>7K · SKI CLUB</h1><div>BETA V2 — PROVA LOCALE</div></header><main><div class="flex"><button data-role="segreteria">Segreteria</button><button data-role="allenatore">Allenatore</button><button data-role="genitore">Genitore</button></div><div id="app"></div><p class="muted">Dati dimostrativi salvati solo su questo dispositivo. Non è una beta online e non invia notifiche.</p></main><script>
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({groups:[{id:1,name:'Agonisti',coaches:[1]},{id:2,name:'Scuola sci',coaches:[2]},{id:3,name:'Prime scivolate',coaches:[2]}],coaches:[{id:1,name:'Mario Rossi'},{id:2,name:'Giulia Bianchi'}],athletes:Array.from({length:100},(_,i)=>({id:i+1,name:'Atleta Demo '+(i+1),groupId:i<30?1:i<75?2:3,credit:i<30?60-i%6:5-i%3,total:i<30?60:5,history:[]}))});
let db;try{db=JSON.parse(localStorage.getItem('7k-beta-v2'))||initial()}catch{db=initial()}
let role='segreteria',tab='gruppi',selectedGroup=1,selectedChild=1;
const save=()=>localStorage.setItem('7k-beta-v2',JSON.stringify(db));
const gname=id=>db.groups.find(g=>g.id===id)?.name||'Senza gruppo';
const options=(items,value)=>items.map(x=>`<option value="${x.id}" ${x.id===value?'selected':''}>${safe(x.name)}</option>`).join('');
const grpOpts=value=>'<option value="0">Senza gruppo</option>'+options(db.groups,value);
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));let out='';
if(role==='segreteria'){out=`<section><h2>Segreteria</h2><div class="flex">${['gruppi','allenatori','atleti'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t==='gruppi'?'Gestione gruppi':t==='allenatori'?'Allenatori':'Atleti e crediti'}</button>`).join('')}</div></section>`;
if(tab==='gruppi'){out+=`<section><h3>Crea gruppo</h3><input id="newGroup" placeholder="Nome nuovo gruppo"><button id="addGroup" class="primary">Aggiungi</button></section><section><h3>Modifica gruppi</h3>${db.groups.map(g=>`<div class="entry"><label>Nome <input id="gn${g.id}" value="${safe(g.name)}"></label><label>Primo maestro <select id="c1${g.id}"><option value="0">Nessuno</option>${options(db.coaches,g.coaches[0])}</select></label><label>Secondo maestro <select id="c2${g.id}"><option value="0">Nessuno</option>${options(db.coaches,g.coaches[1])}</select></label><p class="muted">${db.athletes.filter(a=>a.groupId===g.id).length} atleti</p><button data-save-group="${g.id}">Salva modifiche</button></div>`).join('')}</section>`}
if(tab==='allenatori'){out+=`<section><h3>Nuovo allenatore</h3><input id="newCoach" placeholder="Nome e cognome"><button id="addCoach" class="primary">Aggiungi</button></section><section>${db.coaches.map(c=>`<div class="entry"><input id="cn${c.id}" value="${safe(c.name)}"><button data-save-coach="${c.id}">Salva</button><button data-remove-coach="${c.id}">Rimuovi</button></div>`).join('')}</section>`}
if(tab==='atleti'){out+=`<section><h3>Nuovo atleta</h3><input id="newAthlete" placeholder="Nome e cognome"><select id="newAthleteGroup">${grpOpts(0)}</select><select id="newPack"><option>5</option><option>35</option><option>45</option><option>60</option></select><button id="addAthlete" class="primary">Aggiungi</button></section><section><h3>Modifica atleti</h3><input id="search" placeholder="Cerca nome"><div id="athleteList"></div></section>`}
}
if(role==='allenatore'){out=`<section><h2>Presenze allenatore</h2><select id="pickGroup">${options(db.groups,selectedGroup)}</select><p class="muted">Seleziona i presenti, poi conferma. Solo questa operazione scala i crediti.</p><button id="mark" class="primary">Valida presenze selezionate</button>${db.athletes.filter(a=>a.groupId===selectedGroup).map(a=>`<div class="entry"><label><input type="checkbox" class="attend" value="${a.id}" ${a.credit===0?'disabled':''}> ${safe(a.name)} — ${a.credit} crediti</label></div>`).join('')}</section>`}
if(role==='genitore'){let a=db.athletes.find(x=>x.id===selectedChild)||db.athletes[0];out=`<section><h2>Area genitore (simulazione)</h2><label>Atleta <select id="pickChild">${options(db.athletes,a.id)}</select></label><h3>${safe(a.name)}</h3><p>${safe(gname(a.groupId))}</p><div class="credit">${a.credit} lezioni rimaste</div><p>Pacchetto iniziale: ${a.total}</p><h3>Storico presenze</h3>${a.history.length?a.history.map(h=>`<p>${safe(h)}</p>`).join(''):'<p>Nessuna presenza registrata.</p>'}<button id="report">Segnala un errore (simulazione)</button></section>`}
$('app').innerHTML=out;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(role==='segreteria'&&tab==='gruppi'){ $('addGroup').onclick=()=>{let name=$('newGroup').value.trim();if(!name)return;db.groups.push({id:Date.now(),name,coaches:[]});save();render()};document.querySelectorAll('[data-save-group]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.saveGroup),g=db.groups.find(x=>x.id===id);g.name=$('gn'+id).value.trim()||g.name;g.coaches=[Number($('c1'+id).value),Number($('c2'+id).value)].filter(Boolean);g.coaches=[...new Set(g.coaches)];save();render()})}
if(role==='segreteria'&&tab==='allenatori'){ $('addCoach').onclick=()=>{let name=$('newCoach').value.trim();if(!name)return;db.coaches.push({id:Date.now(),name});save();render()};document.querySelectorAll('[data-save-coach]').forEach(b=>b.onclick=()=>{let c=db.coaches.find(x=>x.id===Number(b.dataset.saveCoach));c.name=$('cn'+c.id).value.trim()||c.name;save();render()});document.querySelectorAll('[data-remove-coach]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.removeCoach);if(!confirm('Rimuovere allenatore?'))return;db.coaches=db.coaches.filter(x=>x.id!==id);db.groups.forEach(g=>g.coaches=g.coaches.filter(x=>x!==id));save();render()})}
if(role==='segreteria'&&tab==='atleti'){ $('addAthlete').onclick=()=>{let name=$('newAthlete').value.trim();if(!name)return;let n=Number($('newPack').value);db.athletes.push({id:Date.now(),name,groupId:Number($('newAthleteGroup').value),total:n,credit:n,history:[]});save();render()};$('search').oninput=drawAthletes;drawAthletes()}
if(role==='allenatore'){$('pickGroup').onchange=e=>{selectedGroup=Number(e.target.value);render()};$('mark').onclick=()=>{let ids=[...document.querySelectorAll('.attend:checked')].map(x=>Number(x.value));if(!ids.length)return alert('Seleziona almeno un atleta');db.athletes.filter(a=>ids.includes(a.id)).forEach(a=>{if(a.credit>0){a.credit--;a.history.unshift('Presenza '+new Date().toLocaleDateString('it-IT'))}});save();render()}}
if(role==='genitore'){$('pickChild').onchange=e=>{selectedChild=Number(e.target.value);render()};$('report').onclick=()=>alert('Segnalazione dimostrativa: nessun messaggio viene inviato.')}
}
function drawAthletes(){let q=$('search').value.toLowerCase();$('athleteList').innerHTML=db.athletes.filter(a=>a.name.toLowerCase().includes(q)).slice(0,100).map(a=>`<div class="entry"><input id="an${a.id}" value="${safe(a.name)}"><select id="ag${a.id}">${grpOpts(a.groupId)}</select><label>Crediti <input type="number" min="0" id="ac${a.id}" value="${a.credit}" style="width:70px"></label><button data-save-athlete="${a.id}">Salva</button></div>`).join('');document.querySelectorAll('[data-save-athlete]').forEach(b=>b.onclick=()=>{let a=db.athletes.find(x=>x.id===Number(b.dataset.saveAthlete)),old=a.credit;a.name=$('an'+a.id).value.trim()||a.name;a.groupId=Number($('ag'+a.id).value);a.credit=Math.max(0,Number($('ac'+a.id).value)||0);if(old!==a.credit)a.history.unshift('Correzione segreteria '+old+' → '+a.credit);save();render()})}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});render();
</script></body></html>
