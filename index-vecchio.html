<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ba1825"><title>7K Komoinen · Beta</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,Arial;color:#222;background:#f6f6f6}*{box-sizing:border-box}body{margin:0}header{background:#b71928;color:white;padding:19px 16px}h1{font-size:24px;margin:0}header p{margin:4px 0 0}main{max-width:800px;margin:auto;padding:16px}section{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #ddd}input[type=text],button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #bbb;background:white}button{cursor:pointer}input[type=text]{width:100%;max-width:340px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.tools label{flex:1;min-width:150px}.subtle{background:#fafafa;border:1px solid #eee;border-radius:9px;padding:12px;margin:10px 0}.small{font-size:13px}button.primary{background:#b71928;color:white;border-color:#b71928}button:disabled{opacity:.4}nav{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.muted{color:#666;font-size:14px}.credit{font-size:26px;font-weight:750;color:#b71928}.tag{font-size:12px;background:#eee;padding:4px 7px;border-radius:6px}label{display:block;margin:10px 0}.hidden{display:none}.notice{background:#fff2d8;padding:10px;border-radius:8px}footer{color:#666;font-size:12px;text-align:center;padding:16px}</style></head><body><header><h1>7K · S.C. 7 KOMOINEN</h1><p>Beta dimostrativa · presenze e crediti</p></header><main><section><strong>Accedi come</strong><nav style="margin-top:10px"><button class="primary" data-role="genitore">Genitore</button><button data-role="allenatore">Allenatore</button><button data-role="segreteria">Segreteria</button></nav><p class="muted">Dati inventati, conservati soltanto in questo browser. Nessun accesso reale.</p></section><div id="app"><section id="loading">Caricamento delle funzioni in corso…</section></div><section><button id="reset">Ripristina i dati di prova</button></section></main><footer>Prototipo offline: non sincronizza dispositivi e non invia notifiche push.</footer><script>
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a)a.innerHTML="<section><strong>Errore di avvio</strong><p>"+String(e.message||"Errore sconosciuto").replace(/</g,"&lt;")+"</p></section>"});

const defaultGroups=['Agonisti U12','Agonisti U16','Agonisti Junior','Scuola sci A','Scuola sci B','Scuola sci C','Prime scivolate A','Prime scivolate B'];
const names=['Andrea','Giulia','Luca','Sofia','Matteo','Emma','Tommaso','Alice','Pietro','Anna','Leonardo','Martina','Davide','Sara','Filippo','Elena','Nicolò','Beatrice','Marco','Chiara'];
const surnames=['Rossi','Bianchi','Verdi','Costa','Moretti','Fontana','Gallo','Ferrari','Marini','Romano'];
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){return Array.from({length:100},(_,i)=>{let g=i<30?Math.floor(i/10):i<75?3+Math.floor((i-30)/15):6+Math.floor((i-75)/13);g=Math.min(g,7);let size=g<3?[35,45,60][i%3]:5;return{id:i+1,name:names[i%20]+' '+surnames[Math.floor(i/10)%10],group:defaultGroups[g],package:size,credit:Math.max(0,size-i%7),planned:false,history:[]}})}
function read(key,fallback){try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
let athletes=read('sevenk_athletes',seed());
let groups=read('sevenk_groups_v2',defaultGroups.map((name,i)=>({id:'g'+(i+1),name,coaches:i<3?['t1']:i<6?['t2']:['t3']})));
let trainers=read('sevenk_trainers_v2',[{id:'t1',name:'Maestro Andrea (demo)'},{id:'t2',name:'Maestra Giulia (demo)'},{id:'t3',name:'Maestro Luca (demo)'}]);
let role='genitore',groupId=groups[0]?.id,child=athletes[0]?.id,tab='gruppi';
function save(){localStorage.setItem('sevenk_athletes',JSON.stringify(athletes));localStorage.setItem('sevenk_groups_v2',JSON.stringify(groups));localStorage.setItem('sevenk_trainers_v2',JSON.stringify(trainers))}
function groupOf(a){return groups.find(g=>g.id===a.groupId)||groups.find(g=>g.name===a.group)}
function groupName(a){return groupOf(a)?.name||'Da assegnare'}
function groupOptions(selected){return `<option value="">Da assegnare</option>`+groups.map(g=>`<option value="${esc(g.id)}" ${selected===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}
function trainerOptions(selected){return `<option value="">Nessuno</option>`+trainers.map(t=>`<option value="${esc(t.id)}" ${selected===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
function log(a,action){a.history??=[];a.history.unshift({date:new Date().toLocaleDateString('it-IT'),action})}
function history(a){return a.history?.length?'<p class="muted">Storico: '+a.history.map(h=>esc(h.date)+' · '+esc(h.action)).join(' · ')+'</p>':'<p class="muted">Nessuna presenza registrata.</p>'}
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('primary',b.dataset.role===role));
if(role==='genitore'){let kids=athletes.slice(0,2);let a=kids.find(x=>x.id===child)||kids[0];if(!a){$('app').innerHTML='<section>Nessun atleta.</section>';return}
$('app').innerHTML=`<section><h2>Area genitore</h2><p class="muted">Famiglia dimostrativa con due figli.</p><label>Figlio <select id="childSel">${kids.map(k=>`<option value="${k.id}" ${k.id===a.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select></label><p>${esc(groupName(a))} · Pacchetto ${a.package} lezioni</p><div class="credit">${a.credit} crediti rimasti</div><label><input type="checkbox" id="planned" ${a.planned?'checked':''}> Confermo la partecipazione al prossimo allenamento</label><p class="notice">La conferma non scala crediti: solo la presenza registrata dall'allenatore.</p>${history(a)}<button id="report">Segnala un errore</button><p id="reported" class="muted"></p></section>`;
$('childSel').onchange=e=>{child=Number(e.target.value);render()};$('planned').onchange=e=>{a.planned=e.target.checked;save();render()};$('report').onclick=()=>$('reported').textContent='Segnalazione dimostrativa: per inviarla serve la versione online.';return}
if(role==='allenatore'){let g=groups.find(g=>g.id===groupId)||groups[0];groupId=g?.id;let list=athletes.filter(a=>groupOf(a)?.id===groupId);$('app').innerHTML=`<section><h2>Area allenatore</h2><label>Gruppo <select id="groupSel">${groups.map(g=>`<option value="${esc(g.id)}" ${g.id===groupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><p class="muted">Allenatori: ${esc((g?.coaches||[]).map(id=>trainers.find(t=>t.id===id)?.name).filter(Boolean).join(', ')||'non assegnati')}</p><p class="muted">Seleziona gli atleti effettivamente presenti.</p><button class="primary" id="register">Registra presenze selezionate</button>${list.map(a=>`<div class="row"><label><input type="checkbox" class="present" value="${a.id}" ${a.credit===0?'disabled':''}> ${esc(a.name)} ${a.planned?'<span class="tag">Confermato</span>':''}</label><span>${a.credit} rimasti</span></div>`).join('')||'<p>Nessun atleta nel gruppo.</p>'}</section>`;
$('groupSel').onchange=e=>{groupId=e.target.value;render()};$('register').onclick=()=>{let ids=[...document.querySelectorAll('.present:checked')].map(x=>Number(x.value));if(!ids.length)return alert('Seleziona almeno un atleta.');let done=0;for(let a of athletes.filter(a=>ids.includes(a.id))){if(a.credit>0){a.credit--;log(a,'Presenza registrata');a.planned=false;done++}}save();alert('Registrate '+done+' presenze.');render()};return}
$('app').innerHTML=`<section><h2>Area segreteria</h2><p>Atleti: <strong>${athletes.length}</strong> · Gruppi: <strong>${groups.length}</strong> · Allenatori: <strong>${trainers.length}</strong></p><p>Pacchetti con 5 crediti o meno: <strong>${athletes.filter(a=>a.credit<=5).length}</strong></p><nav><button data-tab="gruppi" class="${tab==='gruppi'?'primary':''}">Gestione gruppi</button><button data-tab="atleti" class="${tab==='atleti'?'primary':''}">Atleti e crediti</button><button data-tab="allenatori" class="${tab==='allenatori'?'primary':''}">Allenatori</button></nav></section><div id="admin"></div>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(tab==='gruppi')renderGroups();else if(tab==='allenatori')renderTrainers();else renderAthletes();
}
function renderGroups(){$('admin').innerHTML=`<section><h3>Crea un gruppo</h3><form id="newGroup" class="tools"><label>Nome del gruppo<input type="text" name="name" required maxlength="65" placeholder="Es. Agonisti U14"></label><button class="primary">Crea gruppo</button></form></section><section><h3>Modifica gruppi e assegnazioni</h3>${groups.map(g=>`<div class="subtle"><form class="editGroup" data-id="${esc(g.id)}"><label>Nome gruppo<input type="text" name="name" value="${esc(g.name)}" maxlength="65" required></label><div class="tools"><label>Primo allenatore<select name="coach1">${trainerOptions(g.coaches?.[0])}</select></label><label>Secondo allenatore<select name="coach2">${trainerOptions(g.coaches?.[1])}</select></label></div><p class="small muted">${athletes.filter(a=>groupOf(a)?.id===g.id).length} atleti assegnati</p><button class="primary">Salva modifiche</button> <button type="button" class="deleteGroup" data-id="${esc(g.id)}">Elimina gruppo</button></form></div>`).join('')}</section>`;
$('newGroup').onsubmit=e=>{e.preventDefault();let name=e.target.elements.name.value.trim();if(!name)return;if(groups.some(g=>g.name.toLowerCase()===name.toLowerCase()))return alert('Esiste già un gruppo con questo nome.');groups.push({id:'g'+Date.now(),name,coaches:[]});save();render()};
document.querySelectorAll('.editGroup').forEach(f=>f.onsubmit=e=>{e.preventDefault();let g=groups.find(g=>g.id===f.dataset.id);let name=f.elements.name.value.trim();if(!name)return;if(groups.some(other=>other!==g&&other.name.toLowerCase()===name.toLowerCase()))return alert('Nome già utilizzato.');let cs=[f.elements.coach1.value,f.elements.coach2.value].filter(Boolean);if(new Set(cs).size!==cs.length)return alert('Seleziona due allenatori diversi.');g.name=name;g.coaches=cs;save();render()});
document.querySelectorAll('.deleteGroup').forEach(b=>b.onclick=()=>{let g=groups.find(g=>g.id===b.dataset.id),count=athletes.filter(a=>groupOf(a)?.id===g.id).length;if(!confirm(`Eliminare "${g.name}"? ${count} atleti rimarranno da assegnare. I crediti e lo storico non saranno cancellati.`))return;for(let a of athletes.filter(a=>groupOf(a)?.id===g.id)){a.groupId='';a.group='';log(a,'Gruppo eliminato: '+g.name)}groups=groups.filter(x=>x!==g);save();render()})}
function renderTrainers(){$('admin').innerHTML=`<section><h3>Aggiungi allenatore</h3><form id="newTrainer" class="tools"><label>Nome e cognome<input name="name" type="text" maxlength="90" required></label><button class="primary">Aggiungi</button></form></section><section><h3>Modifica allenatori</h3>${trainers.map(t=>`<form class="editTrainer row" data-id="${esc(t.id)}"><input type="text" name="name" value="${esc(t.name)}" maxlength="90" required><button>Salva</button><button type="button" class="deleteTrainer" data-id="${esc(t.id)}">Rimuovi</button></form>`).join('')}</section>`;
$('newTrainer').onsubmit=e=>{e.preventDefault();let name=e.target.elements.name.value.trim();if(!name)return;trainers.push({id:'t'+Date.now(),name});save();render()};
document.querySelectorAll('.editTrainer').forEach(f=>f.onsubmit=e=>{e.preventDefault();let t=trainers.find(t=>t.id===f.dataset.id);t.name=f.elements.name.value.trim();if(!t.name)return;save();render()});
document.querySelectorAll('.deleteTrainer').forEach(b=>b.onclick=()=>{let t=trainers.find(t=>t.id===b.dataset.id);if(!confirm('Rimuovere '+t.name+' dalle assegnazioni?'))return;groups.forEach(g=>g.coaches=g.coaches.filter(id=>id!==t.id));trainers=trainers.filter(x=>x!==t);save();render()})}
function renderAthletes(){$('admin').innerHTML=`<section><h3>Aggiungi atleta</h3><form id="newAthlete"><label>Nome e cognome<input name="name" type="text" maxlength="90" required></label><div class="tools"><label>Gruppo<select name="groupId">${groupOptions('')}</select></label><label>Pacchetto<select name="package"><option>5</option><option>35</option><option>45</option><option>60</option></select></label></div><button class="primary">Aggiungi atleta</button></form></section><section><h3>Atleti e crediti</h3><label>Cerca atleta<input type="text" id="searchAthlete" placeholder="Nome o cognome"></label><div id="athleteList"></div></section>`;
$('newAthlete').onsubmit=e=>{e.preventDefault();let name=e.target.elements.name.value.trim(),pack=Number(e.target.elements.package.value);if(!name)return;athletes.push({id:Math.max(0,...athletes.map(a=>a.id))+1,name,groupId:e.target.elements.groupId.value,package:pack,credit:pack,planned:false,history:[]});save();render()};
$('searchAthlete').oninput=()=>drawAthletes();drawAthletes()}
function drawAthletes(){let q=$('searchAthlete').value.toLocaleLowerCase('it');$('athleteList').innerHTML=athletes.filter(a=>a.name.toLocaleLowerCase('it').includes(q)).map(a=>`<div class="subtle"><form class="editAthlete" data-id="${a.id}"><label>Nome e cognome<input type="text" name="name" maxlength="90" required value="${esc(a.name)}"></label><div class="tools"><label>Gruppo<select name="groupId">${groupOptions(groupOf(a)?.id||'')}</select></label><label>Crediti residui<input type="number" name="credit" min="0" max="999" value="${a.credit}" required></label></div><p class="small muted">Pacchetto iniziale: ${a.package} · ${a.history?.length||0} operazioni nello storico</p><button class="primary">Salva atleta</button></form></div>`).join('')||'<p>Nessun atleta trovato.</p>';
document.querySelectorAll('.editAthlete').forEach(f=>f.onsubmit=e=>{e.preventDefault();let a=athletes.find(a=>a.id===Number(f.dataset.id)),oldGroup=groupName(a),oldCredit=a.credit,newCredit=Number(f.elements.credit.value);if(!Number.isInteger(newCredit)||newCredit<0)return alert('Inserisci un credito valido.');a.name=f.elements.name.value.trim();if(!a.name)return;a.groupId=f.elements.groupId.value;a.group='';a.credit=newCredit;if(oldGroup!==groupName(a))log(a,'Spostamento gruppo: '+oldGroup+' → '+groupName(a));if(oldCredit!==newCredit)log(a,'Correzione segreteria: '+oldCredit+' → '+newCredit);save();render()})}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});
$('reset').onclick=()=>{if(!confirm('Ripristinare tutti i dati fittizi, compresi gruppi e allenatori?'))return;athletes=seed();groups=defaultGroups.map((name,i)=>({id:'g'+(i+1),name,coaches:i<3?['t1']:i<6?['t2']:['t3']}));trainers=[{id:'t1',name:'Maestro Andrea (demo)'},{id:'t2',name:'Maestra Giulia (demo)'},{id:'t3',name:'Maestro Luca (demo)'}];groupId=groups[0].id;save();render()};
try { render(); } catch(e) { document.getElementById('app').textContent='Errore di avvio: '+e.message; } 
</script></body></html>
