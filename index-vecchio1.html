<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ba1825"><title>7K Komoinen · Beta</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,Arial;color:#222;background:#f6f6f6}*{box-sizing:border-box}body{margin:0}header{background:#b71928;color:white;padding:19px 16px}h1{font-size:24px;margin:0}header p{margin:4px 0 0}main{max-width:800px;margin:auto;padding:16px}section{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #ddd}input[type=text],input[type=datetime-local],textarea,input[type=number],button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #bbb;background:white}button{cursor:pointer}input[type=text],input[type=datetime-local],textarea{width:100%;max-width:340px}textarea{min-height:70px}.event-card{border-left:4px solid #b71928}.event-card h3{margin:0 0 8px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.tools label{flex:1;min-width:150px}.subtle{background:#fafafa;border:1px solid #eee;border-radius:9px;padding:12px;margin:10px 0}.small{font-size:13px}button.primary{background:#b71928;color:white;border-color:#b71928}button:disabled{opacity:.4}nav{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.muted{color:#666;font-size:14px}.credit{font-size:26px;font-weight:750;color:#b71928}.tag{font-size:12px;background:#eee;padding:4px 7px;border-radius:6px}label{display:block;margin:10px 0}.hidden{display:none}.notice{background:#fff2d8;padding:10px;border-radius:8px}footer{color:#666;font-size:12px;text-align:center;padding:16px}</style></head><body><header><h1>7K · S.C. 7 KOMOINEN</h1><p>Beta dimostrativa · presenze e crediti</p></header><main><section><strong>Accedi come</strong><nav style="margin-top:10px"><button class="primary" data-role="genitore">Genitore</button><button data-role="allenatore">Allenatore</button><button data-role="segreteria">Segreteria</button></nav><p class="muted">Dati inventati, conservati soltanto in questo browser. Nessun accesso reale.</p></section><div id="app"><section id="loading">Caricamento delle funzioni in corso…</section></div><section><button id="reset">Ripristina i dati di prova</button></section></main><footer>Prototipo offline: non sincronizza dispositivi e non invia notifiche push.</footer><script>
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a)a.innerHTML="<section><strong>Errore di avvio</strong><p>"+String(e.message||"Errore sconosciuto").replace(/</g,"&lt;")+"</p></section>"});

const defaultGroups=['Agonisti U12','Agonisti U16','Agonisti Junior','Scuola sci A','Scuola sci B','Scuola sci C','Prime scivolate A','Prime scivolate B'];
const names=['Andrea','Giulia','Luca','Sofia','Matteo','Emma','Tommaso','Alice','Pietro','Anna','Leonardo','Martina','Davide','Sara','Filippo','Elena','Nicolò','Beatrice','Marco','Chiara'];
const surnames=['Rossi','Bianchi','Verdi','Costa','Moretti','Fontana','Gallo','Ferrari','Marini','Romano'];
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){return Array.from({length:100},(_,i)=>{let g=i<30?Math.floor(i/10):i<75?3+Math.floor((i-30)/15):6+Math.floor((i-75)/13);g=Math.min(g,7);let size=g<3?[35,45,60][i%3]:5;return{id:i+1,name:names[i%20]+' '+surnames[Math.floor(i/10)%10],group:defaultGroups[g],package:size,credit:Math.max(0,size-i%7),planned:false,history:[]}})}
function read(key,fallback){try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
let athletes=read('sevenk_athletes',seed());
let groups=read('sevenk_groups_v2',defaultGroups.map((name,i)=>({id:'g'+(i+1),name,coaches:i<3?['t1']:i<6?['t2']:['t3']})));
let trainers=read('sevenk_trainers_v2',[{id:'t1',name:'Maestro Andrea (demo)'},{id:'t2',name:'Maestra Giulia (demo)'},{id:'t3',name:'Maestro Luca (demo)'}]);
let events=read('sevenk_events_v1',[]);
let role='genitore',groupId=groups[0]?.id,child=athletes[0]?.id,tab='gruppi';
function save(){localStorage.setItem('sevenk_events_v1',JSON.stringify(events));localStorage.setItem('sevenk_athletes',JSON.stringify(athletes));localStorage.setItem('sevenk_groups_v2',JSON.stringify(groups));localStorage.setItem('sevenk_trainers_v2',JSON.stringify(trainers))}
function groupOf(a){return groups.find(g=>g.id===a.groupId)||groups.find(g=>g.name===a.group)}
function groupName(a){return groupOf(a)?.name||'Da assegnare'}
function groupOptions(selected){return `<option value="">Da assegnare</option>`+groups.map(g=>`<option value="${esc(g.id)}" ${selected===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}
function trainerOptions(selected){return `<option value="">Nessuno</option>`+trainers.map(t=>`<option value="${esc(t.id)}" ${selected===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
function log(a,action){a.history??=[];a.history.unshift({date:new Date().toLocaleDateString('it-IT'),action})}
function history(a){return a.history?.length?'<p class="muted">Storico: '+a.history.map(h=>esc(h.date)+' · '+esc(h.action)).join(' · ')+'</p>':'<p class="muted">Nessuna presenza registrata.</p>'}
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('primary',b.dataset.role===role));
if(role==='genitore'){let kids=athletes.slice(0,2);let a=kids.find(x=>x.id===child)||kids[0];if(!a){$('app').innerHTML='<section>Nessun atleta.</section>';return}
 $('app').innerHTML=`<section><h2>Area genitore</h2><p class="muted">Famiglia dimostrativa con due figli.</p><label>Figlio <select id="childSel">${kids.map(k=>`<option value="${k.id}" ${k.id===a.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select></label><p>${esc(groupName(a))} · Pacchetto ${a.package} lezioni</p><div class="credit">${a.credit} crediti rimasti</div>${history(a)}<button id="report">Segnala un errore</button><p id="reported" class="muted"></p></section><section><h2>Prossimi allenamenti</h2>${events.filter(ev=>ev.groupId===groupOf(a)?.id).sort((x,y)=>x.when.localeCompare(y.when)).map(ev=>`<div class="subtle event-card"><h3>${esc(ev.title||'Allenamento')}</h3><p><strong>Quando:</strong> ${esc(formatWhen(ev.when))}<br><strong>Ritrovo:</strong> ${esc(ev.place)}<br><strong>Allenamento:</strong> ${esc(ev.type)}<br><strong>Attrezzatura:</strong> ${esc(ev.gear)}</p>${ev.notes?`<p>${esc(ev.notes)}</p>`:''}<label>Partecipazione <select class="reply" data-event="${esc(ev.id)}"><option value="" ${!ev.replies?.[a.id]?'selected':''}>Non ho ancora risposto</option><option value="yes" ${ev.replies?.[a.id]==='yes'?'selected':''}>Partecipo</option><option value="no" ${ev.replies?.[a.id]==='no'?'selected':''}>Non partecipo</option></select></label>${ev.finalized?'<p class="muted">Presenze già registrate.</p>':''}</div>`).join('')||'<p class="muted">Nessun allenamento programmato per questo gruppo.</p>'}</section>`;
 $('childSel').onchange=e=>{child=Number(e.target.value);render()};document.querySelectorAll('.reply').forEach(el=>el.onchange=()=>{let ev=events.find(x=>x.id===el.dataset.event);if(ev&&!ev.finalized){ev.replies??={};if(el.value)ev.replies[a.id]=el.value;else delete ev.replies[a.id];save();render()}else render()});$('report').onclick=()=>$('reported').textContent='Segnalazione dimostrativa: per inviarla serve la versione online.';return}
if(role==='allenatore'){let g=groups.find(g=>g.id===groupId)||groups[0];groupId=g?.id;let list=athletes.filter(a=>groupOf(a)?.id===groupId);let evs=events.filter(ev=>ev.groupId===groupId).sort((a,b)=>a.when.localeCompare(b.when));$('app').innerHTML=`<section><h2>Area allenatore</h2><label>Gruppo <select id="groupSel">${groups.map(g=>`<option value="${esc(g.id)}" ${g.id===groupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><p class="muted">Allenatori: ${esc((g?.coaches||[]).map(id=>trainers.find(t=>t.id===id)?.name).filter(Boolean).join(', ')||'non assegnati')}</p></section><section><h2>Nuovo avviso</h2>${eventForm(groupId)}</section><section><h2>Allenamenti e presenze</h2>${evs.map(ev=>`<div class="subtle event-card"><h3>${esc(ev.title||'Allenamento')}</h3><p>${esc(formatWhen(ev.when))} · ${esc(ev.place)}<br>${esc(ev.type)} · Attrezzatura: ${esc(ev.gear)}</p>${ev.notes?`<p>${esc(ev.notes)}</p>`:''}<p class="muted">Adesioni: ${Object.values(ev.replies||{}).filter(x=>x==='yes').length} sì · ${Object.values(ev.replies||{}).filter(x=>x==='no').length} no</p>${ev.finalized?'<p><strong>Presenze registrate.</strong> Eventuali correzioni spettano alla segreteria.</p>':`<div class="attendance" data-event="${esc(ev.id)}">${list.map(a=>`<label><input class="present" type="checkbox" value="${a.id}" ${ev.replies?.[a.id]==='yes'?'checked':''} ${a.credit===0?'disabled':''}> ${esc(a.name)} · ${a.credit} crediti ${ev.replies?.[a.id]==='yes'?'(partecipo)':ev.replies?.[a.id]==='no'?'(non partecipo)':'(senza risposta)'}</label>`).join('')}<button class="primary confirmAttendance" data-event="${esc(ev.id)}">Conferma presenze</button></div>`}</div>`).join('')||'<p class="muted">Nessun allenamento programmato.</p>'}</section>`;
 $('groupSel').onchange=e=>{groupId=e.target.value;render()};wireEventForm();document.querySelectorAll('.confirmAttendance').forEach(b=>b.onclick=()=>{let ev=events.find(x=>x.id===b.dataset.event);if(!ev||ev.finalized)return;let ids=[...b.closest('.attendance').querySelectorAll('.present:checked')].map(x=>Number(x.value));let done=[];for(let a of athletes.filter(a=>ids.includes(a.id)&&groupOf(a)?.id===ev.groupId)){if(a.credit>0){a.credit--;log(a,'Presenza '+formatWhen(ev.when)+' · '+ev.title);done.push(a.id)}}ev.finalized=true;ev.present=done;ev.finalizedAt=new Date().toISOString();save();alert('Registrate '+done.length+' presenze. Nessun doppio addebito possibile.');render()});return}

$('app').innerHTML=`<section><h2>Area segreteria</h2><p>Atleti: <strong>${athletes.length}</strong> · Gruppi: <strong>${groups.length}</strong> · Allenatori: <strong>${trainers.length}</strong></p><p>Pacchetti con 5 crediti o meno: <strong>${athletes.filter(a=>a.credit<=5).length}</strong></p><nav><button data-tab="gruppi" class="${tab==='gruppi'?'primary':''}">Gestione gruppi</button><button data-tab="atleti" class="${tab==='atleti'?'primary':''}">Atleti e crediti</button><button data-tab="allenatori" class="${tab==='allenatori'?'primary':''}">Allenatori</button><button data-tab="avvisi" class="${tab==='avvisi'?'primary':''}">Avvisi e presenze</button></nav></section><div id="admin"></div>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(tab==='gruppi')renderGroups();else if(tab==='allenatori')renderTrainers();else if(tab==='avvisi')renderAdminEvents();else renderAthletes();
}
function formatWhen(v){if(!v)return 'Data da definire';let [date,time='']=v.split('T');let [y,m,d]=date.split('-');return `${d}/${m}/${y} ${time}`}
function eventForm(selected){return `<form id="newEvent"><label>Gruppo<select name="groupId" required>${groups.map(g=>`<option value="${esc(g.id)}" ${g.id===selected?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label>Titolo<input name="title" type="text" maxlength="80" placeholder="Es. Allenamento del sabato" required></label><label>Data e ora del ritrovo<input name="when" type="datetime-local" required></label><label>Luogo del ritrovo<input name="place" type="text" maxlength="150" required></label><label>Tipo di allenamento<input name="type" type="text" maxlength="150" placeholder="Es. Slalom, gigante, sci libero" required></label><label>Attrezzatura da portare<input name="gear" type="text" maxlength="250" placeholder="Es. Sci da slalom, protezioni" required></label><label>Note<textarea name="notes" maxlength="500"></textarea></label><button class="primary">Pubblica avviso</button></form>`}
function wireEventForm(){let f=$('newEvent');if(!f)return;f.onsubmit=e=>{e.preventDefault();let v=f.elements;events.push({id:'ev'+Date.now()+'_'+Math.random().toString(36).slice(2,7),groupId:v.groupId.value,title:v.title.value.trim(),when:v.when.value,place:v.place.value.trim(),type:v.type.value.trim(),gear:v.gear.value.trim(),notes:v.notes.value.trim(),replies:{},finalized:false,present:[]});save();render()}}
function renderAdminEvents(){$('admin').innerHTML=`<section><h3>Crea avviso allenamento</h3>${eventForm(groups[0]?.id)}</section><section><h3>Avvisi e presenze</h3>${events.slice().sort((a,b)=>b.when.localeCompare(a.when)).map(ev=>{let g=groups.find(x=>x.id===ev.groupId),list=athletes.filter(a=>groupOf(a)?.id===ev.groupId);return `<div class="subtle event-card"><h3>${esc(ev.title)}</h3><p>${esc(g?.name||'Gruppo eliminato')} · ${esc(formatWhen(ev.when))}<br>Ritrovo: ${esc(ev.place)}<br>${esc(ev.type)} · ${esc(ev.gear)}</p><p class="muted">${list.filter(a=>ev.replies?.[a.id]==='yes').length} partecipano · ${list.filter(a=>ev.replies?.[a.id]==='no').length} assenti · ${list.filter(a=>!ev.replies?.[a.id]).length} senza risposta</p>${ev.finalized?`<p><strong>Presenze registrate: ${ev.present?.length||0}</strong></p>${list.map(a=>`<label><input type="checkbox" class="correctPresent" data-event="${esc(ev.id)}" value="${a.id}" ${ev.present?.includes(a.id)?'checked':''}> ${esc(a.name)} · ${a.credit} crediti</label>`).join('')}<button class="primary correctAttendance" data-event="${esc(ev.id)}">Salva correzioni presenze</button>`:'<p class="muted">In attesa della conferma dell’allenatore.</p>'}<p><button class="deleteEvent" data-event="${esc(ev.id)}" ${ev.finalized?'disabled title="Per conservare lo storico, gli allenamenti registrati non possono essere eliminati"':''}>Elimina avviso</button></p></div>`}).join('')||'<p>Nessun avviso creato.</p>'}</section>`;wireEventForm();document.querySelectorAll('.deleteEvent').forEach(b=>b.onclick=()=>{let ev=events.find(x=>x.id===b.dataset.event);if(!ev||ev.finalized)return;if(!confirm('Eliminare questo avviso?'))return;events=events.filter(x=>x!==ev);save();render()});document.querySelectorAll('.correctAttendance').forEach(b=>b.onclick=()=>{let ev=events.find(x=>x.id===b.dataset.event);if(!ev||!ev.finalized)return;let selected=[...b.closest('.event-card').querySelectorAll('.correctPresent:checked')].map(x=>Number(x.value));let before=new Set(ev.present||[]),after=new Set(selected);for(let a of athletes.filter(a=>groupOf(a)?.id===ev.groupId)){if(before.has(a.id)&&!after.has(a.id)){a.credit++;log(a,'Correzione segreteria: presenza annullata · '+ev.title)}else if(!before.has(a.id)&&after.has(a.id)){if(a.credit<=0){alert('Crediti insufficienti per '+a.name+'. Correggi prima i crediti dalla scheda atleta.');return}}}for(let a of athletes.filter(a=>groupOf(a)?.id===ev.groupId)){if(!before.has(a.id)&&after.has(a.id)){a.credit--;log(a,'Correzione segreteria: presenza aggiunta · '+ev.title)}}ev.present=selected;save();alert('Presenze e crediti aggiornati.');render()})}
function renderGroups(){$('admin').innerHTML=`<section><h3>Crea un gruppo</h3><form id="newGroup" class="tools"><label>Nome del gruppo<input type="text" name="name" required maxlength="65" placeholder="Es. Agonisti U14"></label><button class="primary">Crea gruppo</button></form></section><section><h3>Modifica gruppi e assegnazioni</h3>${groups.map(g=>`<div class="subtle"><form class="editGroup" data-id="${esc(g.id)}"><label>Nome gruppo<input type="text" name="name" value="${esc(g.name)}" maxlength="65" required></label><div class="tools"><label>Primo allenatore<select name="coach1">${trainerOptions(g.coaches?.[0])}</select></label><label>Secondo allenatore<select name="coach2">${trainerOptions(g.coaches?.[1])}</select></label></div><p class="small muted">${athletes.filter(a=>groupOf(a)?.id===g.id).length} atleti assegnati</p><button class="primary">Salva modifiche</button> <button type="button" class="deleteGroup" data-id="${esc(g.id)}">Elimina gruppo</button></form></div>`).join('')}</section>`;
$('newGroup').onsubmit=e=>{e.preventDefault();let name=e.target.elements.name.value.trim();if(!name)return;if(groups.some(g=>g.name.toLowerCase()===name.toLowerCase()))return alert('Esiste già un gruppo con questo nome.');groups.push({id:'g'+Date.now(),name,coaches:[]});save();render()};
document.querySelectorAll('.editGroup').forEach(f=>f.onsubmit=e=>{e.preventDefault();let g=groups.find(g=>g.id===f.dataset.id);let name=f.elements.name.value.trim();if(!name)return;if(groups.some(other=>other!==g&&other.name.toLowerCase()===name.toLowerCase()))return alert('Nome già utilizzato.');let cs=[f.elements.coach1.value,f.elements.coach2.value].filter(Boolean);if(new Set(cs).size!==cs.length)return alert('Seleziona due allenatori diversi.');g.name=name;g.coaches=cs;save();render()});
document.querySelectorAll('.deleteGroup').forEach(b=>b.onclick=()=>{let g=groups.find(g=>g.id===b.dataset.id),count=athletes.filter(a=>groupOf(a)?.id===g.id).length;if(!confirm(`Eliminare "${g.name}"? ${count} atleti rimarranno da assegnare. I crediti e lo storico non saranno cancellati.`))return;for(let a of athletes.filter(a=>groupOf(a)?.id===g.id)){a.groupId='';a.group='';log(a,'Gruppo eliminato: '+g.name)}groups=groups.filter(x=>x!==g);save();render()})}
function renderTrainers(){$('admin').innerHTML=`<section><h3>Aggiungi allenatore</h3><form id="newTrainer" class="tools"><label>Nome e cognome<input name="name" type="text" maxlength="90" required></label><button class="primary">Aggiungi</button></form></section><section><h3>Modifica allenatori</h3>${trainers.map(t=>`<form class="editTrainer row" data-id="${esc(t.id)}"><input type="text" name="name" value="${esc(t.name)}" maxlength="90" required><button>Salva</button><button type="button" class="deleteTrainer" data-id="${esc(t.id)}">Rimuovi</button></form>`).join('')}</section>`;
$('newTrainer').onsubmit=e=>{e.preventDefault();let name=e.target.elements.name.value.trim();if(!name)return;trainers.push({id:'t'+Date.now(),name});save();render()};
document.querySelectorAll('.editTrainer').forEach(f=>f.onsubmit=e=>{e.preventDefault();let t=trainers.find(t=>t.id===f.dataset.id);t.name=f.elements.name.value.trim();if(!t.name)return;save();render()});
document.querySelectorAll('.deleteTrainer').forEach(b=>b.onclick=()=>{let t=trainers.find(t=>t.id===b.dataset.id);if(!confirm('Rimuovere '+t.name+' dalle assegnazioni?'))return;groups.forEach(g=>g.coaches=g.coaches.filter(id=>id!==t.id));trainers=trainers.filter(x=>x!==t);save();render()})}
function renderAthletes(){$('admin').innerHTML=`<section><h3>Aggiungi atleta</h3><form id="newAthlete"><label>Nome e cognome<input name="name" type="text" maxlength="90" required></label><div class="tools"><label>Gruppo<select name="groupId">${groupOptions('')}</select></label><label>Pacchetto<select name="package"><option>5</option><option>35</option><option>45</option><option>60</option></select></label></div><button class="primary">Aggiungi atleta</button></form></section><section><h3>Atleti e crediti</h3><label>Cerca atleta<input type="text" id="searchAthlete" placeholder="Nome o cognome"></label><div id="athleteList"></div></section>`;
$('newAthlete').onsubmit=e=>{e.preventDefault();let name=e.target.elements.name.value.trim(),pack=Number(e.target.elements.package.value);if(!name)return;athletes.push({id:Math.max(0,...athletes.map(a=>a.id))+1,name,groupId:e.target.elements.groupId.value,package:pack,credit:pack,planned:false,history:[]});save();render()};
$('searchAthlete').oninput=()=>drawAthletes();drawAthletes()}
function drawAthletes(){let q=$('searchAthlete').value.toLocaleLowerCase('it');$('athleteList').innerHTML=athletes.filter(a=>a.name.toLocaleLowerCase('it').includes(q)).map(a=>`<div class="subtle"><form class="editAthlete" data-id="${a.id}"><label>Nome e cognome<input type="text" name="name" maxlength="90" required value="${esc(a.name)}"></label><div class="tools"><label>Gruppo<select name="groupId">${groupOptions(groupOf(a)?.id||'')}</select></label><label>Crediti residui<input type="number" name="credit" min="0" max="999" value="${a.credit}" required></label></div><p class="small muted">Pacchetto iniziale: ${a.package} · ${a.history?.length||0} operazioni nello storico</p><button class="primary">Salva atleta</button></form></div>`).join('')||'<p>Nessun atleta trovato.</p>';
document.querySelectorAll('.editAthlete').forEach(f=>f.onsubmit=e=>{e.preventDefault();let a=athletes.find(a=>a.id===Number(f.dataset.id)),oldGroup=groupName(a),oldCredit=a.credit,newCredit=Number(f.elements.credit.value);if(!Number.isInteger(newCredit)||newCredit<0)return alert('Inserisci un credito valido.');a.name=f.elements.name.value.trim();if(!a.name)return;a.groupId=f.elements.groupId.value;a.group='';a.credit=newCredit;if(oldGroup!==groupName(a))log(a,'Spostamento gruppo: '+oldGroup+' → '+groupName(a));if(oldCredit!==newCredit)log(a,'Correzione segreteria: '+oldCredit+' → '+newCredit);save();render()})}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});
$('reset').onclick=()=>{if(!confirm('Ripristinare tutti i dati fittizi, compresi avvisi, gruppi e allenatori?'))return;athletes=seed();groups=defaultGroups.map((name,i)=>({id:'g'+(i+1),name,coaches:i<3?['t1']:i<6?['t2']:['t3']}));events=[];trainers=[{id:'t1',name:'Maestro Andrea (demo)'},{id:'t2',name:'Maestra Giulia (demo)'},{id:'t3',name:'Maestro Luca (demo)'}];groupId=groups[0].id;save();render()};
try { render(); } catch(e) { document.getElementById('app').textContent='Errore di avvio: '+e.message; } 
</script></body></html>
